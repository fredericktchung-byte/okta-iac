name: CD - Terraform Apply

# Trigger: Runs automatically when a PR is merged (pushed) to the main branch
on:
  push:
    branches:
      - main

jobs:
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    
    # Injecting the secrets required by your Terraform providers
    env:
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      # 1. Pulls your repository code into the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installs the Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Initializes the Terraform working directory and downloads providers
      - name: Terraform Init
        run: terraform init

      # 4. Applies the configuration directly to your Okta tenant
      - name: Terraform Apply
        run: terraform apply -auto-approve