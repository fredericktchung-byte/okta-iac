name: Terraform Validate and Format

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.tf'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '.github/workflows/terraform-validate.yml'
permissions:
  pull-requests: write  # Allows the bot to add labels and comments to PRs
  issues: write         # Allows the bot to interact with the issue API
  contents: read        # Allows the bot to read your terraform code
env:
  # Threshold for large changes requiring additional scrutiny (percentage)
  CHANGE_THRESHOLD_PERCENT: 30

jobs:
  terraform:
    name: Validate and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive .
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate
      
      - name: Count Total Terraform Lines
        run: |
          # Dynamically count all lines across all .tf files in the repo
          TOTAL_LINES=$(find . -name "*.tf" -type f -exec cat {} + | wc -l)
          echo "REPO_TOTAL_LINES=$TOTAL_LINES" >> $GITHUB_ENV
      
      - name: Analyze change scope
        id: change-analysis
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Get PR details
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const baseRef = prData.base.sha;
            const headRef = prData.head.sha;

            // Get diff stats
            let addedLines = 0;
            let deletedLines = 0;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            files.forEach(file => {
              if (file.filename.endsWith('.tf')) {
                addedLines += file.additions || 0;
                deletedLines += file.deletions || 0;
              }
            });

            const totalChanges = addedLines + deletedLines;
            const changeThreshold = parseInt(process.env.CHANGE_THRESHOLD_PERCENT);
            
            // NEW LOGIC: Compare against the actual size of the codebase
            const repoTotalLines = parseInt(process.env.REPO_TOTAL_LINES) || 1000;
            const changePercentage = (totalChanges / repoTotalLines) * 100;
            
            console.log(`Total changes: +${addedLines}/-${deletedLines} lines`);
            console.log(`Repo total lines: ${repoTotalLines}`);
            console.log(`Change percentage: ${changePercentage.toFixed(2)}%`);
            console.log(`Threshold: ${changeThreshold}%`);
            
            const requiresScrutiny = changePercentage > changeThreshold;

      - name: Flag for scrutiny
        if: github.event_name == 'pull_request' && steps.change-analysis.outputs.requires_scrutiny == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changePercent = `${{ steps.change-analysis.outputs.change_percentage }}`;
            const threshold = process.env.CHANGE_THRESHOLD_PERCENT;

            // Add label
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['terraform-requires-scrutiny'],
            });

            // Comment on PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `⚠️ **Large infrastructure change detected**\n\nThis PR modifies **${changePercent}%** of Terraform code, exceeding the scrutiny threshold of **${threshold}%**.\n\n### Required Actions:\n- [ ] Reviewer must verify all resource changes\n- [ ] Confirm no unintended resource destruction\n- [ ] Validate impact on active environments\n- [ ] Approve explicitly before merge\n\n**Recommendation:** Ensure this change has been thoroughly tested in a staging environment.`,
            });

      - name: Comment on PR (validation results)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const formatStatus = `${{ steps.fmt.outcome }}` === 'failure' ? '❌ Format check failed' : '✅ Format check passed';
            const validateStatus = `${{ steps.validate.outcome }}` === 'failure' ? '❌ Validation failed' : '✅ Validation passed';
            const scrutinyStatus = `${{ steps.change-analysis.outputs.requires_scrutiny }}` === 'true' ? '⚠️ Large change detected (see separate comment)' : '✅ Change scope within normal limits';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Validation Report\n\n${formatStatus}\n${validateStatus}\n${scrutinyStatus}\n\n**Changes:** +${{ steps.change-analysis.outputs.total_added }} / -${{ steps.change-analysis.outputs.total_deleted }} lines\n\nRun \`terraform fmt -recursive .\` locally to fix any formatting issues.`
            });

      - name: Exit with failure if checks failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
