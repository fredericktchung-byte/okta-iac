name: Emergency Rollback - Passwordless Transformation

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rollback (e.g., "High authentication failure rate", "User lockout issue")'
        required: true
        type: string
      backup_timestamp:
        description: 'Backup timestamp to restore from (leave blank for latest)'
        required: false
        type: string

env:
  TERRAFORM_VERSION: 1.0.0

jobs:
  pre_rollback_validation:
    name: Validate Rollback Readiness
    runs-on: ubuntu-latest
    outputs:
      backup_file: ${{ steps.find_backup.outputs.backup_file }}
      is_valid: ${{ steps.validate.outputs.is_valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find backup file
        id: find_backup
        run: |
          if [ -z "${{ github.event.inputs.backup_timestamp }}" ]; then
            # Find latest backup
            BACKUP=$(ls -rt okta_state_backup_*.json 2>/dev/null | tail -1)
          else
            BACKUP="okta_state_backup_${{ github.event.inputs.backup_timestamp }}.json"
          fi
          
          if [ ! -f "$BACKUP" ]; then
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Backup file not found: $BACKUP"
            exit 1
          fi
          
          echo "backup_file=$BACKUP" >> $GITHUB_OUTPUT
          echo "✅ Found backup: $BACKUP"
          ls -lh "$BACKUP"

      - name: Validate backup integrity
        id: validate
        run: |
          BACKUP="${{ steps.find_backup.outputs.backup_file }}"
          
          # Check file size (should be > 100 bytes)
          SIZE=$(stat -f%z "$BACKUP" 2>/dev/null || stat -c%s "$BACKUP" 2>/dev/null)
          if [ "$SIZE" -lt 100 ]; then
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Backup file too small: $SIZE bytes"
            exit 1
          fi
          
          # Validate JSON
          if ! jq empty "$BACKUP" 2>/dev/null; then
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ ERROR: Backup is not valid JSON"
            exit 1
          fi
          
          echo "is_valid=true" >> $GITHUB_OUTPUT
          echo "✅ Backup validation passed"

  create_incident_ticket:
    name: Create Incident Ticket
    runs-on: ubuntu-latest
    needs: pre_rollback_validation
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString();
            const reason = `${{ github.event.inputs.reason }}`;
            const backupFile = `${{ needs.pre_rollback_validation.outputs.backup_file }}`;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 ROLLBACK INCIDENT: Passwordless Transformation - ${timestamp}`,
              body: |## Emergency Rollback Initiated
    
                **Timestamp:** `{{ timestamp }}`
                **Initiated By:** @`{{ context.actor }}`
                **Reason:** `{{ reason }}`
                **Backup File:** `{{ backupFile }}`
    
                ### Rollback Status
                - Pre-validation: ✅ PASSED
                - Rollback execution: ⏳ IN PROGRESS
    
                ### Artifacts
                - [Workflow Run]: `{{ context.server_url }}/{{ context.repository }}/actions/runs/{{ context.runId }}`
                - Backup: `{{ backupFile }}`
    
                ### Post-Rollback Actions
                - [ ] Notify Slack #incidents channel
                - [ ] Update status page
                - [ ] Notify affected users
                - [ ] Schedule postmortem within 24 hours`,
              labels: ['emergency', 'rollback', 'okta-passwordless'],
              assignees: []
            });
            
            core.setOutput('issue_number', issue.data.number);
            console.log(`✅ Created incident ticket: #${issue.data.number}`);

  notify_slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: create_incident_ticket
    if: always()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_EMERGENCY }}
          payload: |
            {
              "text": "🚨 OKTA PASSWORDLESS ROLLBACK INITIATED",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "Reason",
                      "value": "${{ github.event.inputs.reason }}",
                      "short": false
                    },
                    {
                      "title": "Initiated By",
                      "value": "@${{ github.actor }}",
                      "short": true
                    },
                    {
                      "title": "Incident Ticket",
                      "value": "#${{ needs.create_incident_ticket.outputs.issue_number }}",
                      "short": true
                    },
                    {
                      "title": "Workflow",
                      "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                      "short": false
                    }
                  ]
                }
              ]
            }

  execute_rollback:
    name: Execute Terraform Rollback
    runs-on: ubuntu-latest
    needs: [pre_rollback_validation, create_incident_ticket]
    if: needs.pre_rollback_validation.outputs.is_valid == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Restore backup state
        run: |
          BACKUP="${{ needs.pre_rollback_validation.outputs.backup_file }}"
          echo "🔄 Restoring state from backup: $BACKUP"
          cp "$BACKUP" terraform.tfstate
          
          # Verify state was copied
          if [ -f terraform.tfstate ]; then
            echo "✅ State file restored"
            ls -lh terraform.tfstate
          else
            echo "❌ Failed to restore state file"
            exit 1
          fi

      - name: Initialize Terraform
        run: |
          terraform init -upgrade
          echo "✅ Terraform initialized"

      - name: Validate restored state
        run: |
          terraform validate
          if [ $? -eq 0 ]; then
            echo "✅ Restored state is valid"
          else
            echo "❌ Restored state validation failed"
            exit 1
          fi

      - name: Generate rollback plan
        id: plan
        run: |
          terraform plan -out=rollback.tfplan -detailed-exitcode 2>&1 | tee plan_output.txt
          
          # Capture plan status (0 = no changes, 1 = errors, 2 = has changes)
          PLAN_EXIT=$?
          echo "plan_exit_code=$PLAN_EXIT" >> $GITHUB_OUTPUT
          
          # Show plan
          terraform show rollback.tfplan

      - name: Display rollback plan
        run: |
          echo "📋 Terraform Rollback Plan:"
          echo "=============================="
          terraform show -no-color rollback.tfplan

      - name: Execute rollback (apply)
        id: apply
        run: |
          echo "⚠️ Executing rollback..."
          terraform apply -no-color rollback.tfplan
          
          if [ $? -eq 0 ]; then
            echo "✅ Terraform rollback applied successfully"
            echo "apply_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Terraform rollback failed"
            echo "apply_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

  verify_rollback:
    name: Verify Rollback Success
    runs-on: ubuntu-latest
    needs: [execute_rollback, create_incident_ticket]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify authenticators reverted
        run: |
          echo "🔍 Verifying authenticator configuration..."
          
          # Check password authenticator status
          PASSWORD_STATUS=$(curl -s -X GET "${{ secrets.OKTA_ORG_URL }}/api/v1/meta/types/authenticator" \
            -H "Authorization: Bearer ${{ secrets.OKTA_API_TOKEN }}" \
            | jq -r '.authenticators[] | select(.name=="Password") | .status')
          
          echo "Password Authenticator Status: $PASSWORD_STATUS"
          
          # Check email authenticator status
          EMAIL_STATUS=$(curl -s -X GET "${{ secrets.OKTA_ORG_URL }}/api/v1/meta/types/authenticator" \
            -H "Authorization: Bearer ${{ secrets.OKTA_API_TOKEN }}" \
            | jq -r '.authenticators[] | select(.name=="Email") | .status')
          
          echo "Email Authenticator Status: $EMAIL_STATUS"

      - name: Verify policies reverted
        run: |
          echo "🔍 Verifying sign-on policies..."
          curl -s -X GET "${{ secrets.OKTA_ORG_URL }}/api/v1/policies/signon?type=OKTA_SIGN_ON" \
            -H "Authorization: Bearer ${{ secrets.OKTA_API_TOKEN }}" \
            | jq '.[] | {name, status, description}' | tee policies-verification.json

      - name: Check for authentication errors
        run: |
          echo "🔍 Checking system logs for errors..."
          curl -s -X GET "${{ secrets.OKTA_ORG_URL }}/api/v1/logs?filter=eventType%20eq%20%22user.authentication.auth_failed%22&limit=20" \
            -H "Authorization: Bearer ${{ secrets.OKTA_API_TOKEN }}" \
            | jq '.[] | {timestamp: .published, user: .actor.displayName, message: .displayMessage}' | tee auth-errors.json

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v3
        with:
          name: rollback-verification-${{ github.run_id }}
          path: |
            policies-verification.json
            auth-errors.json

  post_rollback_notification:
    name: Post-Rollback Notification
    runs-on: ubuntu-latest
    needs: [create_incident_ticket, verify_rollback]
    if: always()
    steps:
      - name: Comment on incident ticket
        uses: actions/github-script@v7
        with:
          script: |
            const status = `${{ needs.verify_rollback.result }}`;
            const message = status === 'success' 
              ? '✅ **Rollback Completed Successfully**\n\nAll authenticators and policies have been reverted to their previous state.'
              : '⚠️ **Rollback Completed with Warnings**\n\nPlease verify authenticators and policies manually.';
            
            github.rest.issues.createComment({
              issue_number: ${{ needs.create_incident_ticket.outputs.issue_number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${message}\n\n**Rollback Artifacts:** [Available in workflow](${context.server_url}/${context.repository}/actions/runs/${context.runId})\n\n**Next Steps:**\n1. Notify users that services are restored\n2. Review logs for root cause\n3. Schedule postmortem: \`#incidents\` channel`
            });

      - name: Update Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_EMERGENCY }}
          payload: |
            {
              "text": "✅ OKTA PASSWORDLESS ROLLBACK COMPLETED",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "Status",
                      "value": "Rollback completed successfully",
                      "short": true
                    },
                    {
                      "title": "Estimated Impact Recovery",
                      "value": "10-15 minutes from initiation",
                      "short": true
                    },
                    {
                      "title": "Next Action",
                      "value": "Schedule postmortem in #incidents",
                      "short": false
                    }
                  ]
                }
              ]
            }

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: post_rollback_notification
    if: always()
    steps:
      - name: Lock workflow
        run: echo "✅ Rollback workflow locked. No further automatic deployments until reviewed."

      - name: Create post-incident task
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 POST-INCIDENT REVIEW: Passwordless Rollback #${{ needs.create_incident_ticket.outputs.issue_number }}`,
              body: `## Post-Incident Review

**Parent Incident:** #${{ needs.create_incident_ticket.outputs.issue_number }}

### Required Actions
- [ ] Root cause analysis completed
- [ ] Fix implemented and tested
- [ ] Updated deployment strategy documented
- [ ] Team briefing completed
- [ ] This issue closed

### Questions to Answer
1. What was the root cause?
2. How could this have been prevented?
3. What process improvements are needed?
4. Should rollback criteria be adjusted?

### Timeline
- Rollback initiated: [timestamp]
- Rollback completed: [timestamp]
- Total incident duration: [duration]`,
              labels: ['postmortem', 'okta-passwordless']
            });
