name: CI - Terraform Plan

# Injecting the secrets required by your Terraform providers and OCI Backend
env:
    OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
    OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
    OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
    OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
    OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
    OCI_REGION: ${{ secrets.OCI_REGION }}
    
# Trigger: Runs automatically when a PR is opened against the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    
    # Injecting the secrets required by your Terraform providers (from Step 1)
    env:
      OKTA_API_TOKEN: ${{ secrets.OKTA_API_TOKEN }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}

    steps:
      # 1. Pulls your repository code into the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installs the Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Initializes the Terraform working directory and downloads providers
      - name: Terraform Init
        id: init
        run: terraform init

      # 4. Checks that your code is formatted correctly (GitOps best practice)
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      # 5. Validates the configuration syntax
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # 6. Generates the execution plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true # Ensures we still post the comment even if the plan fails

      # 7. Grabs the plan output and posts it as a PR comment
      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>
            
            *Pushed by: @${{ github.actor }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })